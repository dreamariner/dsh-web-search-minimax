# @dreamariner/dsh-web-search-minimax —— 自挂载 bundle
#
# 本包**同时扮演两个角色**（官方模板同款形态，见 DSH checkout
# packages/preset/agent-preset/skills/cordis-plugin-development/templates/decoration/）：
#   - bundle：`dsh.bundle.patch` 声明本文件 → profile 的 dsh.profile.bundles 列本包即被挂载；
#   - plugin：下面的 `- insert:` 行把**本包自己**挂进运行中的插件树。
# 拆成自挂载是为了让它能被 `dsh plugin --profile <p> add <pkg>` 独立安装（可分发）。
#
# ⚠ 三条写法约束（都踩过或查过，改之前先读）：
#   ① **新增行必须放进 `- insert:`**。顶层 `- id: X` 是给「已存在的行」打补丁；bundle 里
#      没有这个 id 时它是**静默空操作**——插件被跳过，日志里连 warn 都没有
#      （DSH 的 applyEntryPatches：id 不存在只 warn 后 continue）。
#   ② **同名行是整块替换，不是深合并**（`target[key] = value`）。所以 `web` 行必须把
#      config **写全**——base bundle 的 web 行本来是
#      `{searchProvider: deepseek-official, fetchProvider: http}`，只写 searchProvider 会把
#      fetchProvider 一起抹掉。
#   ③ **patch 行的 `name` 只是守卫**（不匹配就 skip 并 warn），不是设置 name 的途径。
#      改已有行时**不要**写 name；`name` 只在 `- insert:` 里才有意义（它是新行的模块引用）。

# 自建 web search provider：走 MiniMax Coding Plan 搜索接口。密钥与 DSH「设置 → 模型」
# 里 MiniMax 提供商的 apiKeyEnv 共用同一个变量名（国内 / 国际两区的域名与密钥都
# 不通用，region 切换）：设置页填的 key 走凭据 seam，~/.dsh/.env 里的走环境层，
# 两条插件都接上了；未配模型提供商时直接写 ~/.dsh/.env 也可以。
# 刻意不带 config 块：三个配置项都有默认值，且**刻意不提供 searchMaxResults**——
# 条数由工具层 tool-web.searchMaxResults 决定（默认 8），插件侧再设同名旋钮会被它
# 单向压住（配大不生效、配小才生效）。
# 另：留一个空的 `config:` 会让 YAML 解析成 null，没必要。
- insert:
    - id: dsh-web-search-minimax
      name: "@dreamariner/dsh-web-search-minimax"

# ⚠ searchProvider 必须显式配：DSH 的选择语义是「未配置 id 且恰好一个可用 provider 才自动选」。
# 注册了自建 provider 后若留空，会与内置 web-search-deepseek 并存而撞
# WEB_PROVIDER_AMBIGUOUS——症状是搜索彻底不可用且原因难猜。
# 这行**随本插件走**（配置归属跟着提供能力的插件，不留在任何聚合 bundle 里）：
# 留在聚合 bundle 里的话，只装聚合 bundle 的用户会把搜索指向一个不存在的 provider
# （WEB_PROVIDER_CONFIGURED_MISSING）。
# ⚠ 整块替换 → fetchProvider 必须一起写全（见上方约束②）。
- id: web
  config:
    searchProvider: minimax
    fetchProvider: http
